services:
  selfsend:
    image: ghcr.io/marbarb/selfsend:${SELFSEND_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "38081:38081/udp"
    volumes:
      - ./data:/data
    environment:
      SELFSEND_TRUST_PROXY: "false"
      SELFSEND_DISCOVERY: "true"
      SELFSEND_DEPLOYMENT_TYPE: "local"
      SELFSEND_PROVIDER: "computer"
      # 如果局域网 DNS 提供稳定域名，可在迁移前后配置为同一个地址。
      # SELFSEND_CANONICAL_URL: "http://selfsend.home:8080"
      # 推荐首次启动后在网页创建密码。也可以取消下一行注释，通过环境变量初始化。
      # SELFSEND_ADMIN_PASSWORD: "replace-with-a-long-password"

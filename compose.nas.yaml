services:
  selfsend:
    image: ghcr.io/marbarb/selfsend:${SELFSEND_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "38081:38081/udp"
    volumes:
      - selfsend-data:/data
    environment:
      SELFSEND_TRUST_PROXY: "false"
      SELFSEND_DISCOVERY: "true"
      # 如果局域网 DNS 提供稳定域名，可以取消注释并填写地址。
      # SELFSEND_CANONICAL_URL: "http://selfsend.home:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  selfsend-data:

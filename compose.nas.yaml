services:
  selfsend:
    image: ghcr.io/marbarb/selfsend:${SELFSEND_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "38081:38081/udp"
    volumes:
      # 设置 SELFSEND_DATA_PATH 为 NAS 上的绝对路径即可使用可见的专用文件夹。
      # 未设置时继续使用命名卷，兼容已有安装。
      - ${SELFSEND_DATA_PATH:-selfsend-data}:/data
    environment:
      SELFSEND_TRUST_PROXY: "false"
      SELFSEND_DISCOVERY: "true"
      SELFSEND_DEPLOYMENT_TYPE: "nas"
      SELFSEND_PROVIDER: "generic"
      # 如果局域网 DNS 提供稳定域名，可以取消注释并填写地址。
      # SELFSEND_CANONICAL_URL: "http://selfsend.home:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  selfsend-data:

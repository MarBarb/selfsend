name: SelfSend
options:
  bundleIdPrefix: com.marbarb
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
targets:
  SelfSend:
    type: application
    platform: iOS
    sources:
      - path: SelfSend
        excludes:
          - Resources/Info.plist
          - Resources/AppIconSource.svg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marbarb.SelfSend
        PRODUCT_NAME: SelfSend
        INFOPLIST_FILE: SelfSend/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - SelfSendTests
  SelfSendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SelfSendTests
    dependencies:
      - target: SelfSend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marbarb.SelfSendTests
        GENERATE_INFOPLIST_FILE: YES
  SelfSendMac:
    type: application
    platform: macOS
    sources:
      - path: SelfSend/App/AppModel.swift
      - path: SelfSend/Models
      - path: SelfSend/Networking
      - path: SelfSend/Persistence
      - path: SelfSendMac
        excludes:
          - Resources/Info.plist
          - Resources/SelfSendMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marbarb.SelfSendMac
        PRODUCT_NAME: SelfSend
        INFOPLIST_FILE: SelfSendMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SelfSendMac/Resources/SelfSendMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - SelfSendMacTests
  SelfSendMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SelfSendTests
    dependencies:
      - target: SelfSendMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marbarb.SelfSendMacTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SelfSend.app/Contents/MacOS/SelfSend"
        BUNDLE_LOADER: "$(TEST_HOST)"
